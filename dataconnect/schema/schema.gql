# Sahakara (Housemaid Management App) — Firebase Data Connect schema.
# 24 tables in 6 groups: users & households, tasks, rewards, attendance &
# leave, payments, household & admin. Data Connect turns each `@table` type
# into a PostgreSQL table (Cloud SQL); access rules live on the operations
# in ../connector/, not here.
#
# Design rules (keep these in mind when writing operations):
#   1. Never update or delete LedgerEntry rows — fix mistakes with a
#      `correction` entry so payment history stays trustworthy. (No update/
#      delete mutation exists for it, so clients can't do it.)
#   2. On a pay raise, set endDate on the old Contract and insert a new one
#      rather than editing rate in place, so past months keep the old rate.
#   3. Tasks/attendance/pay all reference a HouseholdMember, not a User
#      directly, so one maid can work across several households.

# ── enums ────────────────────────────────────────────────────────────────

enum AppLanguage { si ta en }
# What kind of user this is. Owners and maids pick their type when signing
# up in the mobile app; household staff (maid/driver/cook/gardener) all sign
# up as `maid`. `admin` is the Sahakara team using the web admin panel — it
# can't be chosen at sign-up, only set directly in the database.
enum AccountType { owner maid admin }
enum MemberRole { owner adult maid driver cook gardener }
# Where an owner's request for someone to join the household stands. Staff
# join as `pending` (and inactive) with a proposed contract, and become
# active members only once they accept it.
enum MembershipStatus { pending accepted declined }
enum PayType { monthly daily hourly per_visit }
enum TaskCategory { kitchen cleaning laundry cooking other }
enum RecurrenceType { once daily weekly fortnightly monthly quarterly }
enum TaskPriority { high medium low }
enum TaskStatus { pending started done need_help cant_do carried_forward }
enum CantDoReason { no_supplies power_cut water_cut sick no_time other }
enum TaskLogAction { started done help cant_do }
enum BadgeType { six_months one_year perfect_month }
enum AttendanceDayType { full half late early_leave leave absent holiday }
enum LeaveType { paid unpaid sick }
enum LeaveStatus { pending approved rejected }
enum HolidayType { poya public festival }
enum LedgerEntryType { salary payment advance advance_repay bonus deduction overtime correction }
enum PaymentMethod { cash bank mobile_wallet }
enum SalaryPaymentStatus { scheduled paid }
enum AdvanceRequestStatus { pending approved rejected }
enum DisputeStatus { open resolved }
enum ShoppingStatus { needed bought }
enum DocumentType { nic agency contract other }
enum BillingPeriod { monthly yearly }
# No longer used (plans are now PaymentPlan rows). Kept because the migration
# that removed HouseholdSubscription.plan tries to drop this type before the
# column, which fails. Safe to delete once every database has migrated.
enum SubscriptionPlan { free basic premium }

# ── users & households ──────────────────────────────────────────────────

type User @table {
  id: UUID! @default(expr: "uuidV4()")
  # Firebase Auth uid. Null for a maid an owner invited by email who hasn't
  # signed up yet — their first login claims the row (ClaimInvitedProfile).
  authUid: String @unique
  email: String! @unique
  name: String!
  accountType: AccountType! @default(value: owner)
  language: AppLanguage! @default(value: en)
  profilePhoto: String
  # Profile kept up to date in Settings. Areas (maids only) are free text,
  # e.g. "Nugegoda"; spoken languages are app language codes.
  preferredAreas: [String!]
  spokenLanguages: [AppLanguage!]
  createdAt: Timestamp! @default(expr: "request.time")
}

type Household @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  address: String
  # Town or neighbourhood, e.g. "Nugegoda", shown to maids alongside their
  # preferred work areas.
  area: String
  owner: User!
  createdAt: Timestamp! @default(expr: "request.time")
}

type HouseholdMember @table @unique(fields: ["household", "user"]) {
  id: UUID! @default(expr: "uuidV4()")
  household: Household!
  user: User!
  role: MemberRole!
  # False while a request is pending or declined (see `status`), and for
  # staff the owner has removed (`accepted` but no longer active).
  active: Boolean! @default(value: true)
  status: MembershipStatus! @default(value: accepted)
  joinedOn: Date! @default(expr: "request.time")
}

type Contract @table {
  id: UUID! @default(expr: "uuidV4()")
  member: HouseholdMember!
  payType: PayType!
  rate: Float! # for `monthly`, the basic salary — bonuses go in the ledger
  # A fixed extra paid every month on top of the basic salary, if any.
  allowance: Float
  offDays: String
  workingHours: String
  scope: String
  startDate: Date! @default(expr: "request.time")
  endDate: Date # null while this is the current contract
  createdAt: Timestamp! @default(expr: "request.time")
}

# ── tasks ────────────────────────────────────────────────────────────────

# The shared, admin-curated, trilingual task list.
type LibraryTask @table {
  id: UUID! @default(expr: "uuidV4()")
  category: TaskCategory! @default(value: other)
  nameEn: String!
  nameSi: String
  nameTa: String
  imageUrl: String
  audioSi: String
  audioTa: String
  audioEn: String
}

# A household's recurring task. Needs either `library` or `customTitle`.
type TaskTemplate @table {
  id: UUID! @default(expr: "uuidV4()")
  household: Household!
  library: LibraryTask
  customTitle: String
  customTitleSi: String
  customTitleTa: String
  photoUrl: String
  donePhotoUrl: String
  recurrence: RecurrenceType! @default(value: once)
  recurrenceDay: String
  estMinutes: Int
  priority: TaskPriority! @default(value: medium)
  needsPhotoProof: Boolean! @default(value: false)
  createdBy: User!
  active: Boolean! @default(value: true)
}

type Task @table @index(fields: ["assignedToId", "dueDate"]) {
  id: UUID! @default(expr: "uuidV4()")
  template: TaskTemplate!
  # Null until the owner assigns it — an owner can plan tasks before adding
  # any staff.
  assignedTo: HouseholdMember
  dueDate: Date!
  sortOrder: Int! @default(value: 0)
  status: TaskStatus! @default(value: pending)
  cantDoReason: CantDoReason
  # What the staff member optionally wrote / photographed when marking the
  # task need_help or cant_do, for the owner to see. Cleared on the next
  # status change.
  statusNote: String
  statusPhoto: String
  completedAt: Timestamp
}

type TaskLog @table {
  id: UUID! @default(expr: "uuidV4()")
  task: Task!
  action: TaskLogAction!
  proofPhoto: String
  note: String
  byUser: User!
  at: Timestamp! @default(expr: "request.time")
}

# ── rewards (positive only — no penalty/demerit table) ─────────────────

type Star @table {
  id: UUID! @default(expr: "uuidV4()")
  task: Task
  member: HouseholdMember!
  givenBy: User!
  voiceNote: String
  note: String
  at: Timestamp! @default(expr: "request.time")
}

type Badge @table {
  id: UUID! @default(expr: "uuidV4()")
  member: HouseholdMember!
  badgeType: BadgeType!
  earnedOn: Date! @default(expr: "request.time")
}

# ── attendance & leave ───────────────────────────────────────────────────

type Attendance @table @unique(fields: ["member", "day"]) {
  id: UUID! @default(expr: "uuidV4()")
  member: HouseholdMember!
  day: Date!
  checkIn: Timestamp
  checkOut: Timestamp
  dayType: AttendanceDayType!
  overtimeHours: Float! @default(value: 0)
  note: String
}

# toDate must be on or after fromDate.
type LeaveRequest @table {
  id: UUID! @default(expr: "uuidV4()")
  member: HouseholdMember!
  fromDate: Date!
  toDate: Date!
  leaveType: LeaveType!
  isHalfDay: Boolean! @default(value: false)
  reason: String
  voiceNote: String
  status: LeaveStatus! @default(value: pending)
  decidedBy: User
  createdAt: Timestamp! @default(expr: "request.time")
}

# Global, admin-curated Poya / public holiday calendar.
type Holiday @table {
  id: UUID! @default(expr: "uuidV4()")
  date: Date!
  nameEn: String!
  nameSi: String
  nameTa: String
  type: HolidayType!
}

# ── payments ─────────────────────────────────────────────────────────────

type Advance @table {
  id: UUID! @default(expr: "uuidV4()")
  member: HouseholdMember!
  amount: Float!
  remaining: Float!
  givenOn: Date! @default(expr: "request.time")
  note: String
  createdBy: User!
  at: Timestamp! @default(expr: "request.time")
}

type AdvanceRequest @table {
  id: UUID! @default(expr: "uuidV4()")
  member: HouseholdMember!
  amount: Float!
  reason: String
  status: AdvanceRequestStatus! @default(value: pending)
  advance: Advance
  requestedAt: Timestamp! @default(expr: "request.time")
  reviewedAt: Timestamp
}

type SalaryPayment @table {
  id: UUID! @default(expr: "uuidV4()")
  member: HouseholdMember!
  amount: Float!
  paymentDate: Date!
  status: SalaryPaymentStatus! @default(value: scheduled)
  note: String
  paidAt: Timestamp
  createdBy: User!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Every money movement is one row here. Balance due = sum of rows for a
# member. Append-only — add a `correction` entry instead of editing.
# A `deduction` must have a note.
type LedgerEntry @table @index(fields: ["memberId", "month"]) {
  id: UUID! @default(expr: "uuidV4()")
  member: HouseholdMember!
  entryType: LedgerEntryType!
  amount: Float!
  method: PaymentMethod
  note: String
  advance: Advance
  month: String! # 'YYYY-MM'
  createdBy: User!
  at: Timestamp! @default(expr: "request.time")
}

type Payslip @table @unique(fields: ["memberId", "month"]) {
  id: UUID! @default(expr: "uuidV4()")
  member: HouseholdMember!
  month: String!
  daysWorked: Int! @default(value: 0)
  totalEarned: Float! @default(value: 0)
  totalDeductions: Float! @default(value: 0)
  totalPaid: Float! @default(value: 0)
  balance: Float! @default(value: 0)
  language: AppLanguage! @default(value: en)
  pdfUrl: String
}

# Raised against either a ledger entry or an attendance record.
type Dispute @table {
  id: UUID! @default(expr: "uuidV4()")
  raisedBy: User!
  ledger: LedgerEntry
  attendance: Attendance
  message: String!
  status: DisputeStatus! @default(value: open)
  resolvedNote: String
  createdAt: Timestamp! @default(expr: "request.time")
}

# ── household & admin ────────────────────────────────────────────────────

# Needs either `text` or `voiceUrl`.
type Message @table @index(fields: ["householdId", "at"]) {
  id: UUID! @default(expr: "uuidV4()")
  household: Household!
  fromUser: User!
  toUser: User!
  text: String
  voiceUrl: String
  read: Boolean! @default(value: false)
  at: Timestamp! @default(expr: "request.time")
}

type ShoppingItem @table {
  id: UUID! @default(expr: "uuidV4()")
  household: Household!
  item: String!
  addedBy: User!
  status: ShoppingStatus! @default(value: needed)
  at: Timestamp! @default(expr: "request.time")
}

type MemberDocument @table {
  id: UUID! @default(expr: "uuidV4()")
  member: HouseholdMember!
  docType: DocumentType!
  fileUrl: String!
  uploadedAt: Timestamp! @default(expr: "request.time")
}

# A plan on the admin-curated price list, e.g. "Basic — Rs 1,500 a month".
type PaymentPlan @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  price: Float! # in LKR, charged once per billingPeriod
  billingPeriod: BillingPeriod! @default(value: monthly)
  description: String
  createdAt: Timestamp! @default(expr: "request.time")
}

# The plan an admin has put a household on. Keyed by household, so each
# household has at most one.
type HouseholdSubscription @table(key: "household") {
  household: Household!
  plan: PaymentPlan!
  # What this household actually pays. Starts at the plan's price, but the
  # admin can set a different one (e.g. a discount).
  price: Float!
  paidUntil: Date
  paymentRef: String
}
