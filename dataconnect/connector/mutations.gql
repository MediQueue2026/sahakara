# Write operations. Anything that needs "is the caller the household
# owner?" runs as a @transaction whose first step is a @check query, so the
# write only happens if the check passes.

# ── profile ──────────────────────────────────────────────────────────────

# Attaches this Firebase account to the row for its email address: a maid
# an owner already invited (no authUid yet), or a row whose old Firebase
# account was deleted. Firebase Auth allows one account per email, so a
# token carrying this email means this account owns it now.
mutation ClaimInvitedProfile @auth(level: USER) {
  user_updateMany(
    where: { email: { eq_expr: "auth.token.email" } }
    data: { authUid_expr: "auth.uid" }
  )
}

# Saves the signed-in Firebase account as a `User` row, right after sign-up.
# Nobody can make themselves an admin this way.
mutation CreateMyProfile($name: String!, $accountType: AccountType!)
@auth(expr: "auth.uid != '' && vars.accountType != 'admin'") {
  user_insert(
    data: {
      authUid_expr: "auth.uid"
      email_expr: "auth.token.email"
      name: $name
      accountType: $accountType
    }
  )
}

mutation SetMyName($name: String!) @auth(level: USER) {
  user_updateMany(
    where: { authUid: { eq_expr: "auth.uid" } }
    data: { name: $name }
  )
}

mutation SetMyLanguage($language: AppLanguage!) @auth(level: USER) {
  user_updateMany(
    where: { authUid: { eq_expr: "auth.uid" } }
    data: { language: $language }
  )
}

# ── households & membership ─────────────────────────────────────────────

# Creates the household and makes the caller its owner.
mutation CreateHousehold($name: String!, $address: String)
@auth(level: USER)
@transaction {
  query @redact {
    users(where: { authUid: { eq_expr: "auth.uid" } })
      @check(expr: "this.size() == 1", message: "Profile not found") {
      id
    }
  }
  household_insert(
    data: {
      name: $name
      address: $address
      ownerId_expr: "response.query.users[0].id"
    }
  )
  householdMember_insert(
    data: {
      householdId_expr: "response.household_insert.id"
      userId_expr: "response.query.users[0].id"
      role: owner
    }
  )
}

# Owner adds someone who already has a user row (see UserIdByEmail).
mutation AddHouseholdMember(
  $householdId: UUID!
  $userId: UUID!
  $role: MemberRole!
) @auth(level: USER) @transaction {
  query @redact {
    households(
      where: {
        id: { eq: $householdId }
        owner: { authUid: { eq_expr: "auth.uid" } }
      }
    )
      @check(
        expr: "this.size() == 1"
        message: "Only the household owner can add members"
      ) {
      id
    }
  }
  householdMember_insert(
    data: { householdId: $householdId, userId: $userId, role: $role }
  )
}

# Owner adds someone who has never used the app: pre-creates their user row
# (claimed on their first login) and links it into the household.
mutation InviteHouseholdMember(
  $householdId: UUID!
  $email: String!
  $role: MemberRole!
) @auth(level: USER) @transaction {
  query @redact {
    households(
      where: {
        id: { eq: $householdId }
        owner: { authUid: { eq_expr: "auth.uid" } }
      }
    )
      @check(
        expr: "this.size() == 1"
        message: "Only the household owner can add members"
      ) {
      id
    }
  }
  user_insert(data: { email: $email, name: $email, accountType: maid })
  householdMember_insert(
    data: {
      householdId: $householdId
      userId_expr: "response.user_insert.id"
      role: $role
    }
  )
}

# ── contracts ────────────────────────────────────────────────────────────

# Closes the member's open contract and inserts a new one — a raise or a
# changed schedule is a new contract row, not an edit, so past months still
# calculate at the old rate.
mutation SaveContract(
  $memberId: UUID!
  $payType: PayType!
  $rate: Float!
  $offDays: String
  $workingHours: String
) @auth(level: USER) @transaction {
  query @redact {
    householdMembers(
      where: {
        id: { eq: $memberId }
        household: { owner: { authUid: { eq_expr: "auth.uid" } } }
      }
    )
      @check(
        expr: "this.size() == 1"
        message: "Only the household owner can change contracts"
      ) {
      id
    }
  }
  contract_updateMany(
    where: { memberId: { eq: $memberId }, endDate: { isNull: true } }
    data: { endDate_expr: "request.time" }
  )
  contract_insert(
    data: {
      memberId: $memberId
      payType: $payType
      rate: $rate
      offDays: $offDays
      workingHours: $workingHours
    }
  )
}

# ── daily tasks ──────────────────────────────────────────────────────────

# Owner adds a task for one day, optionally assigning it to a staff member
# straight away (see AssignDailyTask to assign it later). It's saved as a
# one-off TaskTemplate (from the library, or a custom title) plus the Task
# row for that day. An assignee must be active staff of the same household.
mutation AddDailyTask(
  $householdId: UUID!
  $assignedToId: UUID
  $dueDate: Date!
  $libraryId: UUID
  $customTitle: String
  $estMinutes: Int
  $priority: TaskPriority!
)
@auth(
  expr: "auth.uid != '' && (vars.libraryId != null || (vars.customTitle != null && vars.customTitle != ''))"
)
@transaction {
  query @redact {
    households(
      where: {
        id: { eq: $householdId }
        owner: { authUid: { eq_expr: "auth.uid" } }
      }
    )
      @check(
        expr: "this.size() == 1"
        message: "Only the household owner can assign tasks"
      ) {
      owner {
        id
      }
    }
    householdMembers(
      where: {
        id: { eq: $assignedToId }
        household: { id: { eq: $householdId } }
        active: { eq: true }
        role: { ne: owner }
      }
    )
      @check(
        expr: "vars.assignedToId == null || this.size() == 1"
        message: "Tasks can only be assigned to this household's staff"
      ) {
      id
    }
  }
  taskTemplate_insert(
    data: {
      householdId: $householdId
      libraryId: $libraryId
      customTitle: $customTitle
      estMinutes: $estMinutes
      priority: $priority
      createdById_expr: "response.query.households[0].owner.id"
    }
  )
  task_insert(
    data: {
      templateId_expr: "response.taskTemplate_insert.id"
      assignedToId: $assignedToId
      dueDate: $dueDate
    }
  )
}

# Owner assigns a task to a staff member, or moves it to someone else. The
# task starts over as pending, since any progress was the previous
# assignee's. The assignee must be active staff of the task's household.
mutation AssignDailyTask($id: UUID!, $assignedToId: UUID!)
@auth(level: USER)
@transaction {
  query @redact {
    tasks(
      where: {
        id: { eq: $id }
        template: {
          household: {
            owner: { authUid: { eq_expr: "auth.uid" } }
            householdMembers_on_household: {
              exist: {
                id: { eq: $assignedToId }
                active: { eq: true }
                role: { ne: owner }
              }
            }
          }
        }
      }
    )
      @check(
        expr: "this.size() == 1"
        message: "Only the household owner can assign tasks, and only to this household's staff"
      ) {
      id
    }
  }
  task_update(
    id: $id
    data: {
      assignedToId: $assignedToId
      status: pending
      cantDoReason: null
      completedAt: null
    }
  )
}

# Owner removes a task added by mistake, together with its one-off template.
mutation DeleteDailyTask($id: UUID!) @auth(level: USER) @transaction {
  query @redact {
    tasks(
      where: {
        id: { eq: $id }
        template: {
          recurrence: { eq: once }
          household: { owner: { authUid: { eq_expr: "auth.uid" } } }
        }
      }
    )
      @check(
        expr: "this.size() == 1"
        message: "Only the household owner can remove tasks"
      ) {
      template {
        id
      }
    }
  }
  task_delete(id: $id)
  taskTemplate_deleteMany(
    where: { id: { eq_expr: "response.query.tasks[0].template.id" } }
  )
}

# The staff member a task is assigned to reports progress on it, and the
# change is logged in TaskLog. $action must be the log entry matching
# $status (need_help is logged as `help`), and a reason is required for
# cant_do and only for cant_do. completedAt is set when the task becomes
# done and cleared if it moves back out of done.
mutation UpdateMyTaskStatus(
  $id: UUID!
  $status: TaskStatus!
  $action: TaskLogAction!
  $cantDoReason: CantDoReason
)
@auth(
  expr: "auth.uid != '' && ((vars.status == 'started' && vars.action == 'started') || (vars.status == 'done' && vars.action == 'done') || (vars.status == 'need_help' && vars.action == 'help') || (vars.status == 'cant_do' && vars.action == 'cant_do')) && ((vars.status == 'cant_do') == (vars.cantDoReason != null))"
)
@transaction {
  query @redact {
    tasks(
      where: {
        id: { eq: $id }
        assignedTo: {
          active: { eq: true }
          user: { authUid: { eq_expr: "auth.uid" } }
        }
      }
    )
      @check(
        expr: "this.size() == 1"
        message: "Only the person the task is assigned to can update it"
      ) {
      assignedTo {
        user {
          id
        }
      }
    }
  }
  task_update(id: $id, data: { status: $status, cantDoReason: $cantDoReason })
  done: task_updateMany(
    where: { id: { eq: $id }, status: { eq: done } }
    data: { completedAt_expr: "request.time" }
  )
  notDone: task_updateMany(
    where: { id: { eq: $id }, status: { ne: done } }
    data: { completedAt: null }
  )
  taskLog_insert(
    data: {
      taskId: $id
      action: $action
      byUserId_expr: "response.query.tasks[0].assignedTo.user.id"
    }
  )
}

# ── admin panel (admin accounts only) ────────────────────────────────────
# Each one first checks that the caller's user row is an admin.

mutation AddLibraryTask(
  $category: TaskCategory!
  $nameEn: String!
  $nameSi: String
  $nameTa: String
) @auth(level: USER) @transaction {
  query @redact {
    users(
      where: { authUid: { eq_expr: "auth.uid" }, accountType: { eq: admin } }
    ) @check(expr: "this.size() == 1", message: "Admins only") {
      id
    }
  }
  libraryTask_insert(
    data: { category: $category, nameEn: $nameEn, nameSi: $nameSi, nameTa: $nameTa }
  )
}

mutation DeleteLibraryTask($id: UUID!)
@auth(level: USER) @transaction {
  query @redact {
    users(
      where: { authUid: { eq_expr: "auth.uid" }, accountType: { eq: admin } }
    ) @check(expr: "this.size() == 1", message: "Admins only") {
      id
    }
  }
  libraryTask_delete(id: $id)
}

mutation AddHoliday(
  $date: Date!
  $type: HolidayType!
  $nameEn: String!
  $nameSi: String
  $nameTa: String
) @auth(level: USER) @transaction {
  query @redact {
    users(
      where: { authUid: { eq_expr: "auth.uid" }, accountType: { eq: admin } }
    ) @check(expr: "this.size() == 1", message: "Admins only") {
      id
    }
  }
  holiday_insert(
    data: {
      date: $date
      type: $type
      nameEn: $nameEn
      nameSi: $nameSi
      nameTa: $nameTa
    }
  )
}

mutation DeleteHoliday($id: UUID!) @auth(level: USER) @transaction {
  query @redact {
    users(
      where: { authUid: { eq_expr: "auth.uid" }, accountType: { eq: admin } }
    ) @check(expr: "this.size() == 1", message: "Admins only") {
      id
    }
  }
  holiday_delete(id: $id)
}
