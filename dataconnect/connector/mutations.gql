mutation AddPaymentPlan(
  $name: String!
  $price: Float!
  $billingPeriod: BillingPeriod!
  $description: String
) @auth(level: USER) @transaction {
  query @redact {
    users(
      where: { authUid: { eq_expr: "auth.uid" }, accountType: { eq: admin } }
    ) @check(expr: "this.size() == 1", message: "Admins only") {
      id
    }
  }
  paymentPlan_insert(
    data: {
      name: $name
      price: $price
      billingPeriod: $billingPeriod
      description: $description
    }
  )
