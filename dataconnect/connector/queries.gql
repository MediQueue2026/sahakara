# Read operations. Clients can only run the operations defined in this
# connector, so each one's `where` filter is its access rule: a household's
# data is only returned to an active member of that household.

# ── profile & membership ─────────────────────────────────────────────────

# The signed-in user's row, or the row for their email address that isn't
# linked to this account yet — one an owner pre-created, or one left by a
# deleted Firebase account (see ClaimInvitedProfile).
query MyProfile @auth(level: USER) {
  users(
    where: {
      _or: [
        { authUid: { eq_expr: "auth.uid" } }
        { email: { eq_expr: "auth.token.email" } }
      ]
    }
    limit: 1
  ) {
    id
    authUid
    email
    name
    accountType
    language
  }
}

# The signed-in user's most recently joined active household.
query MyMembership @auth(level: USER) {
  householdMembers(
    where: {
      active: { eq: true }
      user: { authUid: { eq_expr: "auth.uid" } }
    }
    orderBy: [{ joinedOn: DESC }]
    limit: 1
  ) {
    id
    role
    household {
      id
      name
      address
    }
  }
}

# Selects a specific accepted household after the user accepts its invite.
query MyMembershipById($id: UUID!) @auth(level: USER) {
  householdMembers(
    where: {
      id: { eq: $id }
      active: { eq: true }
      user: { authUid: { eq_expr: "auth.uid" } }
    }
    limit: 1
  ) {
    id
    role
    household {
      id
      name
      address
    }
  }
}

# Requests from owners for the signed-in user to join their household that
# are still waiting for an answer, each with the proposed contract.
query MyHouseholdInvites @auth(level: USER) {
  householdMembers(
    where: {
      status: { eq: pending }
      user: {
        _or: [
          { authUid: { eq_expr: "auth.uid" } }
          { email: { eq_expr: "auth.token.email" } }
        ]
      }
    }
    orderBy: [{ joinedOn: DESC }]
  ) {
    id
    role
    household {
      name
      address
      owner {
        name
      }
    }
    contracts_on_member(where: { endDate: { isNull: true } }, limit: 1) {
      payType
      rate
      allowance
      offDays
      workingHours
    }
  }
}

# Everyone in a household, including people with a pending or declined
# request (see `status`); only an active member can list them.
query HouseholdMembers($householdId: UUID!) @auth(level: USER) {
  householdMembers(
    where: {
      household: {
        id: { eq: $householdId }
        householdMembers_on_household: {
          exist: {
            active: { eq: true }
            user: { authUid: { eq_expr: "auth.uid" } }
          }
        }
      }
    }
    orderBy: [{ joinedOn: ASC }]
  ) {
    id
    role
    active
    status
    user {
      id
      name
      email
    }
  }
}

# Used when an owner adds staff by email, to link an existing user rather
# than create a duplicate. Returns only the id.
query UserIdByEmail($email: String!) @auth(level: USER) {
  users(where: { email: { eq: $email } }, limit: 1) {
    id
  }
}

# ── contracts ────────────────────────────────────────────────────────────

query CurrentContract($memberId: UUID!) @auth(level: USER) {
  contracts(
    where: {
      endDate: { isNull: true }
      member: {
        _and: [
          { id: { eq: $memberId } }
          {
            _or: [
              {
                active: { eq: true }
                user: { authUid: { eq_expr: "auth.uid" } }
              }
              {
                household: {
                  owner: { authUid: { eq_expr: "auth.uid" } }
                }
              }
            ]
          }
        ]
      }
    }
    orderBy: [{ startDate: DESC }]
    limit: 1
  ) {
    id
    payType
    rate
    allowance
    offDays
    workingHours
    startDate
  }
}

# ── daily tasks ──────────────────────────────────────────────────────────

# Every task due on one day in a household, for the owner's planning view —
# including ones not assigned to anyone yet (assignedTo is null). Owner only — staff see just their own (MyTasksForDay).
query HouseholdTasksForDay($householdId: UUID!, $dueDate: Date!)
@auth(level: USER) {
  tasks(
    where: {
      dueDate: { eq: $dueDate }
      template: {
        household: {
          id: { eq: $householdId }
          owner: { authUid: { eq_expr: "auth.uid" } }
        }
      }
    }
    orderBy: [{ sortOrder: ASC }]
  ) {
    id
    status
    cantDoReason
    completedAt
    assignedTo {
      id
      user {
        name
      }
    }
    template {
      customTitle
      photoUrl
      estMinutes
      priority
      library {
        category
        nameEn
        nameSi
        nameTa
      }
    }
  }
}

# The signed-in staff member's tasks for one day, across their active
# memberships.
query MyTasksForDay($dueDate: Date!) @auth(level: USER) {
  tasks(
    where: {
      dueDate: { eq: $dueDate }
      assignedTo: {
        active: { eq: true }
        user: { authUid: { eq_expr: "auth.uid" } }
      }
    }
    orderBy: [{ sortOrder: ASC }]
  ) {
    id
    status
    cantDoReason
    completedAt
    template {
      customTitle
      photoUrl
      estMinutes
      priority
      library {
        category
        nameEn
        nameSi
        nameTa
      }
    }
  }
}

# ── shared, admin-curated lists ──────────────────────────────────────────

query LibraryTasks @auth(level: USER) {
  libraryTasks(orderBy: [{ category: ASC }, { nameEn: ASC }]) {
    id
    category
    nameEn
    nameSi
    nameTa
