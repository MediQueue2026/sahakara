# ── admin panel (admin accounts only) ────────────────────────────────────

query AdminHouseholds @auth(level: USER) {
  # Returns an error instead of the households unless the caller's user row
  # is an admin.
  users(where: { authUid: { eq_expr: "auth.uid" }, accountType: { eq: admin } })
    @redact
    @check(expr: "this.size() == 1", message: "Admins only") {
    id
  }
  households(orderBy: [{ createdAt: DESC }]) {
    id
    name
    address
    createdAt
    householdMembers_on_household {
      id
    }
  }
}
